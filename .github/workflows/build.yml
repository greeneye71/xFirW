name: Build and test Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore xFirW.slnx --locked-mode
      - name: Build
        run: dotnet build xFirW.slnx -c Release --no-restore -m:1
      - name: Test synthetic documents
        run: dotnet test tests/Xfir.Tests -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Publish prototype (requires .NET Desktop Runtime 10 and WebView2)
        run: dotnet publish src/Xfir.App -c Release --no-restore -o artifacts/xFirW
      - uses: actions/upload-artifact@v4
        with:
          name: xFirW-windows-prototype
          path: artifacts/xFirW/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
